name: Build Ubuntu kernel headers images

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      series:
        description: 'Comma-separated series names, "active" for all active, or "all" for all releases'
        required: false
        type: string
        default: 'active'
      max_jobs:
        description: 'Max build jobs per series (0 = no limit/error if >256, default 256 for schedule)'
        required: false
        type: number
        default: 0
      force:
        description: 'Rebuild even if tag exists'
        required: false
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Get Ubuntu releases
        id: releases
        uses: vicamo/actions-library/ubuntu-releases@v1

      - name: Build fan-out matrix
        id: matrix
        run: |
          matrix=$(python3 -c "
          import json, os

          input_series = os.environ['INPUT_SERIES']
          releases = json.loads(os.environ['RELEASES_JSON'])

          if input_series == 'active':
              series_list = [r['codename'] for r in releases if r['active']]
          elif input_series == 'all':
              series_list = [r['codename'] for r in releases]
          else:
              series_list = [s.strip() for s in input_series.split(',') if s.strip()]

          matrix_includes = [{'series': s} for s in series_list]
          print(json.dumps({'include': matrix_includes}))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | python3 -m json.tool
        env:
          INPUT_SERIES: ${{ inputs.series || 'active' }}
          RELEASES_JSON: ${{ steps.releases.outputs.json }}

  build-series:
    needs: discover
    if: fromJson(needs.discover.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/ubuntu-version.yml
    with:
      series: ${{ matrix.series }}
      max_jobs: ${{ github.event_name == 'schedule' && 256 || inputs.max_jobs }}
      force: ${{ inputs.force || false }}
    permissions:
      packages: write
