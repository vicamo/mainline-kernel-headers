name: Build Ubuntu kernel headers images

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      series:
        description: 'Comma-separated series names, or "active" for all active series'
        required: false
        type: string
        default: 'active'
      limit:
        description: 'Max kernels to install per build (0 = unlimited, empty = Dockerfile default 50)'
        required: false
        type: string
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.filter.outputs.series }}
    steps:
      - name: Get Ubuntu releases
        id: releases
        uses: vicamo/actions-library/ubuntu-releases@v1

      - name: Filter active series
        id: filter
        run: |
          input="${{ inputs.series || 'active' }}"
          if [ "${input}" = "active" ]; then
            series=$(echo '${{ steps.releases.outputs.json }}' | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          active = [r['codename'] for r in releases if r['active']]
          print(json.dumps(active))
          ")
          else
            series=$(echo "${input}" | python3 -c "
          import json, sys
          names = [s.strip() for s in sys.stdin.read().split(',') if s.strip()]
          print(json.dumps(names))
          ")
          fi
          echo "series=${series}" >> "$GITHUB_OUTPUT"

  headers:
    needs: discover
    if: needs.discover.outputs.series != '[]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        series: ${{ fromJson(needs.discover.outputs.series) }}
    steps:
      - uses: actions/checkout@v7

      - name: Maximize Docker disk space
        uses: vicamo/actions-library/maximize-docker-disk@v1

      - name: Set up QEMU (Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enable containerd-snapshotter
        run: |
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push headers image
        run: |
          ./ubuntu/scripts/build-ubuntu "${{ matrix.series }}" --push \
              ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Generate gap report
        if: always()
        run: |
          mkdir -p _site/data
          python3 ubuntu/scripts/report-gaps --format json "${{ matrix.series }}" > "_site/data/${{ matrix.series }}.json"
          python3 ubuntu/scripts/report-gaps --from-json < "_site/data/${{ matrix.series }}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gap report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-gap-report-${{ matrix.series }}
          path: _site/data/${{ matrix.series }}.json
          retention-days: 1

  publish-status:
    needs: [discover, headers]
    if: always() && needs.headers.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download gap reports
        uses: actions/download-artifact@v8
        with:
          pattern: ubuntu-gap-report-*
          path: _site/data
          merge-multiple: true

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Prepare gh-pages content
        run: |
          mkdir -p gh-pages/data/ubuntu

          cp pages/index.html gh-pages/index.html

          # Merge new JSON reports from artifacts (overwrite with fresh data)
          for f in _site/data/*.json; do
            [ -f "${f}" ] && cp "${f}" "gh-pages/data/ubuntu/$(basename "${f}")"
          done

          python3 pages/scripts/rebuild-meta ubuntu gh-pages/data/ubuntu \
            | tee gh-pages/data/ubuntu/meta.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
