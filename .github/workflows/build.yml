name: Build kernel headers

on:
  schedule:
    # Every Saturday at 06:00 UTC
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      kver:
        description: 'Kernel series to build, comma-separated (e.g. "6.6", "6.x", "6.6,6.12,7.0"). Use "active" for non-EOL versions, "all" for all versions >= 4.7.'
        required: false
        type: string
        default: 'active'
      force_install:
        description: 'Force rebuild headers image even if archive is unchanged'
        required: false
        type: boolean
        default: false
      clean_install:
        description: 'Build headers image from scratch instead of the previous image'
        required: false
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.matrix }}
      dkms_series: ${{ steps.versions.outputs.dkms_series }}
    steps:
      - uses: actions/checkout@v6

      - name: Discover active versions (schedule)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.kver == 'active')
        run: |
          matrix=$(curl -fsSL https://www.kernel.org/releases.json | python3 -c "
          import json, sys, re
          data = json.load(sys.stdin)
          seen = set()
          versions = []
          for r in data['releases']:
              if r['moniker'] not in ('stable', 'longterm'):
                  continue
              if r['iseol']:
                  continue
              m = re.match(r'^(\d+\.\d+)', r['version'])
              if m:
                  series = m.group(1)
                  if series not in seen:
                      seen.add(series)
                      versions.append(series)
          print(json.dumps(versions))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_ENV"

      - name: Discover all versions >= 4.7
        if: github.event_name == 'workflow_dispatch' && inputs.kver == 'all'
        run: |
          matrix=$(curl -fsSL https://kernel.ubuntu.com/mainline/ | python3 -c "
          import sys, re, json
          html = sys.stdin.read()
          seen = set()
          versions = []
          for m in re.finditer(r'href=\"v(\d+\.\d+)(?:\.\d+)?/\"', html):
              series = m.group(1)
              major, minor = (int(x) for x in series.split('.'))
              if (major, minor) < (4, 7):
                  continue
              if series not in seen:
                  seen.add(series)
                  versions.append(series)
          versions.sort(key=lambda s: tuple(int(x) for x in s.split('.')))
          print(json.dumps(versions))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_ENV"

      - name: Parse input versions (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.kver != 'active' && inputs.kver != 'all'
        run: |
          matrix=$(echo "${{ inputs.kver }}" | python3 -c "
          import sys, json, re, urllib.request

          raw = [v.strip() for v in sys.stdin.read().split(',') if v.strip()]
          # Check if any entry uses wildcard 'x'
          need_expand = any(re.fullmatch(r'\d+\.x', v) for v in raw)
          all_series = None
          if need_expand:
              html = urllib.request.urlopen('https://kernel.ubuntu.com/mainline/').read().decode()
              all_series = set()
              for m in re.finditer(r'href=\"v(\d+\.\d+)(?:\.\d+)?/\"', html):
                  all_series.add(m.group(1))

          versions = []
          seen = set()
          for v in raw:
              wm = re.fullmatch(r'(\d+)\.x', v)
              if wm:
                  major = int(wm.group(1))
                  matched = sorted(
                      [s for s in all_series if int(s.split('.')[0]) == major],
                      key=lambda s: tuple(int(x) for x in s.split('.'))
                  )
                  for s in matched:
                      if s not in seen:
                          seen.add(s)
                          versions.append(s)
              else:
                  if v not in seen:
                      seen.add(v)
                      versions.append(v)
          print(json.dumps(versions))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_ENV"

      - name: Compute dkms series
        run: |
          source scripts/lib/ubuntu-series.sh
          seen=()
          for kver in $(echo "${matrix}" | python3 -c "import json,sys; [print(v) for v in json.load(sys.stdin)]"); do
            s=$(ubuntu_series_for_kver "${kver}")
            if ! printf '%s\n' "${seen[@]}" | grep -qx "${s}"; then
              seen+=("${s}")
            fi
          done
          dkms_series=$(printf '%s\n' "${seen[@]}" | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "dkms_series=${dkms_series}" >> "$GITHUB_ENV"

      - name: Set output
        id: versions
        run: |
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "dkms_series=${dkms_series}" >> "$GITHUB_OUTPUT"

  dkms:
    needs: discover
    if: needs.discover.outputs.dkms_series != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJson(needs.discover.outputs.dkms_series) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dkms image for ${{ matrix.series }}
        run: |
          tag="vicamo/mainline-kernel-headers:${{ matrix.series }}-dkms"
          if docker buildx imagetools inspect "${tag}" >/dev/null 2>&1; then
            echo "dkms image ${tag} already exists, skipping"
            exit 0
          fi
          base_image="vicamo/ubuntu:${{ matrix.series }}"
          platforms=$(docker buildx imagetools inspect "${base_image}" --raw \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          platforms = []
          for m in data.get('manifests', []):
              ann = m.get('annotations') or {}
              if 'attestation' in ann.get('vnd.docker.reference.type', ''):
                  continue
              p = m.get('platform', {})
              if p.get('os') == 'unknown':
                  continue
              plat = p.get('os', '') + '/' + p.get('architecture', '')
              if p.get('variant'):
                  plat += '/' + p['variant']
              platforms.append(plat)
          if platforms:
              print(','.join(platforms))
          ")
          if [ -z "${platforms}" ]; then
            echo "ERROR: could not detect platforms from ${base_image}" >&2
            exit 1
          fi
          echo "Detected platforms: ${platforms}"
          docker buildx build \
            -f Dockerfile.dkms \
            --platform "${platforms}" \
            --build-arg "BASE_IMAGE=${base_image}" \
            --push \
            -t "${tag}" .

  build:
    needs: [discover, dkms]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kver: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enable containerd-snapshotter
        run: |
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push archive for ${{ matrix.kver }}
        run: ./scripts/build-archive "${{ matrix.kver }}" --push

      - name: Build and push headers for ${{ matrix.kver }}
        run: ./scripts/build-version "${{ matrix.kver }}" --push ${{ inputs.force_install && '--force' || '' }} ${{ inputs.clean_install && '--clean' || '' }}

      - name: Gap report for ${{ matrix.kver }}
        if: always()
        run: python3 scripts/report-gaps "${{ matrix.kver }}" >> "$GITHUB_STEP_SUMMARY"
