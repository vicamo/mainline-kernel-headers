name: Build DKMS base images

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      series:
        description: 'Comma-separated series names, or "active" for all active series'
        required: false
        type: string
        default: 'active'
      force:
        description: 'Force rebuild even if the image already exists'
        required: false
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.filter.outputs.series }}
    steps:
      - name: Get Ubuntu releases
        id: releases
        uses: vicamo/actions-library/ubuntu-releases@v1

      - name: Filter active series
        id: filter
        run: |
          input="${{ inputs.series || 'active' }}"
          if [ "${input}" = "active" ]; then
            series=$(echo '${{ steps.releases.outputs.json }}' | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          active = [r['codename'] for r in releases if r['active']]
          print(json.dumps(active))
          ")
          else
            series=$(echo "${input}" | python3 -c "
          import json, sys
          names = [s.strip() for s in sys.stdin.read().split(',') if s.strip()]
          print(json.dumps(names))
          ")
          fi
          echo "series=${series}" >> "$GITHUB_OUTPUT"

  dkms:
    needs: discover
    if: needs.discover.outputs.series != '[]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        series: ${{ fromJson(needs.discover.outputs.series) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dkms image for ${{ matrix.series }}
        run: |
          tag="ghcr.io/vicamo/linux-headers:${{ matrix.series }}-dkms"
          if [ "${{ inputs.force }}" != "true" ] && docker buildx imagetools inspect "${tag}" >/dev/null 2>&1; then
            echo "dkms image ${tag} already exists, skipping"
            exit 0
          fi
          base_image="ghcr.io/vicamo/ubuntu:${{ matrix.series }}"
          platforms=$(docker buildx imagetools inspect "${base_image}" --raw \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          platforms = []
          for m in data.get('manifests', []):
              ann = m.get('annotations') or {}
              if 'attestation' in ann.get('vnd.docker.reference.type', ''):
                  continue
              p = m.get('platform', {})
              if p.get('os') == 'unknown':
                  continue
              plat = p.get('os', '') + '/' + p.get('architecture', '')
              if p.get('variant'):
                  plat += '/' + p['variant']
              platforms.append(plat)
          if platforms:
              print(','.join(platforms))
          ")
          if [ -z "${platforms}" ]; then
            echo "ERROR: could not detect platforms from ${base_image}" >&2
            exit 1
          fi
          echo "Detected platforms: ${platforms}"
          docker buildx build \
            -f dkms/Dockerfile.dkms \
            --platform "${platforms}" \
            --build-arg "BASE_IMAGE=${base_image}" \
            --push \
            -t "${tag}" .
