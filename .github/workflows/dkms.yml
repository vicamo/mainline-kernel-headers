name: Build DKMS base images

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      series:
        description: 'Comma-separated series names, or "active" for all active series'
        required: false
        type: string
        default: 'active'
      force:
        description: 'Force rebuild even if the image already exists'
        required: false
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.filter.outputs.series }}
    steps:
      - name: Get Ubuntu releases
        id: releases
        uses: vicamo/actions-library/ubuntu-releases@v1

      - name: Filter active series
        id: filter
        run: |
          series=$(python3 -c "
          import json, os
          input_series = os.environ['INPUT_SERIES']
          releases = json.loads(os.environ['RELEASES_JSON'])
          by_codename = {r['codename']: r for r in releases}
          if input_series == 'active':
              names = [r['codename'] for r in releases if r['active']]
          else:
              names = [s.strip() for s in input_series.split(',') if s.strip()]
          result = []
          for name in names:
              entry = {'codename': name, 'tags': [name + '-dkms']}
              r = by_codename.get(name, {})
              if r.get('suite'):
                  entry['tags'].append(r['suite'] + '-dkms')
              if r.get('release'):
                  entry['tags'].append(r['release'] + '-dkms')
              result.append(entry)
          print(json.dumps(result))
          ")
          echo "series=${series}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_SERIES: ${{ inputs.series || 'active' }}
          RELEASES_JSON: ${{ steps.releases.outputs.json }}

  dkms:
    needs: discover
    if: needs.discover.outputs.series != '[]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.discover.outputs.series) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dkms image for ${{ matrix.codename }}
        run: |
          primary_tag="ghcr.io/vicamo/linux-headers:${{ matrix.codename }}-dkms"
          if [ "${{ inputs.force }}" != "true" ] && docker buildx imagetools inspect "${primary_tag}" >/dev/null 2>&1; then
            echo "dkms image ${primary_tag} already exists, skipping"
            exit 0
          fi
          base_image="ghcr.io/vicamo/ubuntu:${{ matrix.codename }}"
          platforms=$(docker buildx imagetools inspect "${base_image}" --raw \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          platforms = []
          for m in data.get('manifests', []):
              ann = m.get('annotations') or {}
              if 'attestation' in ann.get('vnd.docker.reference.type', ''):
                  continue
              p = m.get('platform', {})
              if p.get('os') == 'unknown':
                  continue
              plat = p.get('os', '') + '/' + p.get('architecture', '')
              if p.get('variant'):
                  plat += '/' + p['variant']
              platforms.append(plat)
          if platforms:
              print(','.join(platforms))
          ")
          if [ -z "${platforms}" ]; then
            echo "ERROR: could not detect platforms from ${base_image}" >&2
            exit 1
          fi
          echo "Detected platforms: ${platforms}"

          # Build tag arguments
          tag_args=()
          for tag in $(echo '${{ toJson(matrix.tags) }}' | python3 -c "import json,sys; [print(t) for t in json.load(sys.stdin)]"); do
            tag_args+=(-t "ghcr.io/vicamo/linux-headers:${tag}")
          done

          docker buildx build \
            -f dkms/Dockerfile.dkms \
            --platform "${platforms}" \
            --build-arg "BASE_IMAGE=${base_image}" \
            --push \
            "${tag_args[@]}" .
