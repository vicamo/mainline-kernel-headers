name: Build mainline kernel images

on:
  schedule:
    # Every Saturday at 06:00 UTC
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      kver:
        description: 'Kernel series to build, comma-separated (e.g. "6.6", "6.x", "6.6,6.12,7.0"). Use "active" for non-EOL versions, "all" for all versions >= 4.7.'
        required: false
        type: string
        default: 'active'
      series:
        description: 'Ubuntu series, comma-separated (e.g. "noble,stonking"). Use "active" for active series, "all" for all releases.'
        required: false
        type: string
        default: 'active'
      max_jobs:
        description: 'Max build jobs per series (0 = no limit/error if >256, default 256 for schedule)'
        required: false
        type: number
        default: 0
      force:
        description: 'Rebuild even if tag exists'
        required: false
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Get Ubuntu releases
        id: releases
        uses: vicamo/actions-library/ubuntu-releases@v1

      - name: Build fan-out matrix
        id: matrix
        run: |
          matrix=$(python3 -c "
          import json, os, re, sys, urllib.request

          sys.path.insert(0, 'scripts')
          from lib.series import series_for_kver, RELEASE_KERNELS

          input_kver = os.environ['INPUT_KVER']
          input_series = os.environ['INPUT_SERIES']
          releases = json.loads(os.environ['RELEASES_JSON'])
          event_name = os.environ['EVENT_NAME']

          # Resolve kver list
          if input_kver == 'active':
              data = json.loads(urllib.request.urlopen('https://www.kernel.org/releases.json').read())
              seen = set()
              kver_list = []
              for r in data['releases']:
                  if r['moniker'] not in ('stable', 'longterm'):
                      continue
                  if r['iseol']:
                      continue
                  m = re.match(r'^(\d+\.\d+)', r['version'])
                  if m and m.group(1) not in seen:
                      seen.add(m.group(1))
                      kver_list.append(m.group(1))
          elif input_kver == 'all':
              html = urllib.request.urlopen('https://kernel.ubuntu.com/mainline/').read().decode()
              seen = set()
              kver_list = []
              for m in re.finditer(r'href=\"v(\d+\.\d+)(?:\.\d+)?/\"', html):
                  series = m.group(1)
                  major, minor = (int(x) for x in series.split('.'))
                  if (major, minor) < (4, 7):
                      continue
                  if series not in seen:
                      seen.add(series)
                      kver_list.append(series)
              kver_list.sort(key=lambda s: tuple(int(x) for x in s.split('.')))
          else:
              raw = [v.strip() for v in input_kver.split(',') if v.strip()]
              need_expand = any(re.fullmatch(r'\d+\.x', v) for v in raw)
              all_series = None
              if need_expand:
                  html = urllib.request.urlopen('https://kernel.ubuntu.com/mainline/').read().decode()
                  all_series = set()
                  for m in re.finditer(r'href=\"v(\d+\.\d+)(?:\.\d+)?/\"', html):
                      all_series.add(m.group(1))
              kver_list = []
              seen = set()
              for v in raw:
                  wm = re.fullmatch(r'(\d+)\.x', v)
                  if wm:
                      major = int(wm.group(1))
                      matched = sorted(
                          [s for s in all_series if int(s.split('.')[0]) == major],
                          key=lambda s: tuple(int(x) for x in s.split('.'))
                      )
                      for s in matched:
                          if s not in seen:
                              seen.add(s)
                              kver_list.append(s)
                  else:
                      if v not in seen:
                          seen.add(v)
                          kver_list.append(v)

          # Resolve series list
          by_codename = {r['codename']: r for r in releases}
          if input_series == 'active':
              series_list = [r['codename'] for r in releases if r['active']]
          elif input_series == 'all':
              series_list = [r['codename'] for r in releases]
          else:
              series_list = [s.strip() for s in input_series.split(',') if s.strip()]

          # Build codename → kver mapping
          # For each (kver, codename): only include if series_for_kver(kver) <= codename
          codename_order = [r.codename for r in RELEASE_KERNELS]
          def codename_idx(c):
              try:
                  return codename_order.index(c)
              except ValueError:
                  return 9999

          matrix_includes = []
          for series in series_list:
              s_idx = codename_idx(series)
              valid_kvers = []
              for kver in kver_list:
                  origin = series_for_kver(kver)
                  if codename_idx(origin) <= s_idx:
                      valid_kvers.append(kver)
              if valid_kvers:
                  matrix_includes.append({
                      'series': series,
                      'kver': ','.join(valid_kvers),
                  })

          print(json.dumps({'include': matrix_includes}))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | python3 -m json.tool
        env:
          INPUT_KVER: ${{ inputs.kver || 'active' }}
          INPUT_SERIES: ${{ inputs.series || 'active' }}
          RELEASES_JSON: ${{ steps.releases.outputs.json }}
          EVENT_NAME: ${{ github.event_name }}

  build-series:
    needs: discover
    if: fromJson(needs.discover.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/mainline-version.yml
    with:
      kver: ${{ matrix.kver }}
      series: ${{ matrix.series }}
      max_jobs: ${{ github.event_name == 'schedule' && 256 || inputs.max_jobs }}
      force: ${{ inputs.force || false }}
    permissions:
      packages: write
