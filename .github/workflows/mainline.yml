name: Build mainline kernel images

on:
  # schedule:
  #   # Every Saturday at 06:00 UTC
  #   - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      kver:
        description: 'Kernel series to build, comma-separated (e.g. "6.6", "6.x", "6.6,6.12,7.0"). Use "active" for non-EOL versions, "all" for all versions >= 4.7.'
        required: false
        type: string
        default: 'active'
      force_install:
        description: 'Force rebuild mainline image even if archive is unchanged'
        required: false
        type: boolean
        default: false
      scratch:
        description: 'Build mainline image from scratch instead of the previous image'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Max kernel versions to install per build (0 = unlimited, empty = Dockerfile default 50)'
        required: false
        type: string
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover active versions (schedule)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.kver == 'active')
        run: |
          matrix=$(curl -fsSL https://www.kernel.org/releases.json | python3 -c "
          import json, sys, re
          data = json.load(sys.stdin)
          seen = set()
          versions = []
          for r in data['releases']:
              if r['moniker'] not in ('stable', 'longterm'):
                  continue
              if r['iseol']:
                  continue
              m = re.match(r'^(\d+\.\d+)', r['version'])
              if m:
                  series = m.group(1)
                  if series not in seen:
                      seen.add(series)
                      versions.append(series)
          print(json.dumps(versions))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_ENV"

      - name: Discover all versions >= 4.7
        if: github.event_name == 'workflow_dispatch' && inputs.kver == 'all'
        run: |
          matrix=$(curl -fsSL https://kernel.ubuntu.com/mainline/ | python3 -c "
          import sys, re, json
          html = sys.stdin.read()
          seen = set()
          versions = []
          for m in re.finditer(r'href=\"v(\d+\.\d+)(?:\.\d+)?/\"', html):
              series = m.group(1)
              major, minor = (int(x) for x in series.split('.'))
              if (major, minor) < (4, 7):
                  continue
              if series not in seen:
                  seen.add(series)
                  versions.append(series)
          versions.sort(key=lambda s: tuple(int(x) for x in s.split('.')))
          print(json.dumps(versions))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_ENV"

      - name: Parse input versions (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.kver != 'active' && inputs.kver != 'all'
        run: |
          matrix=$(echo "${{ inputs.kver }}" | python3 -c "
          import sys, json, re, urllib.request

          raw = [v.strip() for v in sys.stdin.read().split(',') if v.strip()]
          # Check if any entry uses wildcard 'x'
          need_expand = any(re.fullmatch(r'\d+\.x', v) for v in raw)
          all_series = None
          if need_expand:
              html = urllib.request.urlopen('https://kernel.ubuntu.com/mainline/').read().decode()
              all_series = set()
              for m in re.finditer(r'href=\"v(\d+\.\d+)(?:\.\d+)?/\"', html):
                  all_series.add(m.group(1))

          versions = []
          seen = set()
          for v in raw:
              wm = re.fullmatch(r'(\d+)\.x', v)
              if wm:
                  major = int(wm.group(1))
                  matched = sorted(
                      [s for s in all_series if int(s.split('.')[0]) == major],
                      key=lambda s: tuple(int(x) for x in s.split('.'))
                  )
                  for s in matched:
                      if s not in seen:
                          seen.add(s)
                          versions.append(s)
              else:
                  if v not in seen:
                      seen.add(v)
                      versions.append(v)
          print(json.dumps(versions))
          ")
          echo "matrix=${matrix}" >> "$GITHUB_ENV"

      - name: Set output
        id: versions
        run: |
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        kver: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Maximize Docker disk space
        uses: vicamo/actions-library/maximize-docker-disk@v1

      - name: Set up QEMU (Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq binfmt-support qemu-user-static

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enable containerd-snapshotter
        run: |
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push archive for ${{ matrix.kver }}
        run: ./scripts/build-archive "${{ matrix.kver }}" --push

      - name: Build and push mainline image for ${{ matrix.kver }}
        run: |
          ./scripts/build-mainline "${{ matrix.kver }}" --push \
              ${{ inputs.force_install && '--force' || '' }} \
              ${{ inputs.scratch && '--scratch' || '' }} \
              ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: Gap report for ${{ matrix.kver }}
        if: always()
        run: |
          mkdir -p _site/data
          python3 scripts/report-gaps-mainline --format json "${{ matrix.kver }}" > "_site/data/${{ matrix.kver }}.json"
          python3 scripts/report-gaps-mainline --from-json < "_site/data/${{ matrix.kver }}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gap report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gap-report-${{ matrix.kver }}
          path: _site/data/${{ matrix.kver }}.json
          retention-days: 1

  publish-status:
    needs: [discover, build]
    if: always() && needs.build.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download gap reports
        uses: actions/download-artifact@v8
        with:
          pattern: gap-report-*
          path: _site/data
          merge-multiple: true

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Prepare gh-pages content
        run: |
          mkdir -p gh-pages/data/mainline

          cp pages/index.html gh-pages/index.html

          # Merge new JSON reports from artifacts (overwrite with fresh data)
          for f in _site/data/*.json; do
            [ -f "${f}" ] && cp "${f}" "gh-pages/data/mainline/$(basename "${f}")"
          done

          python3 scripts/rebuild-pages-meta mainline gh-pages/data/mainline \
            | tee gh-pages/data/mainline/meta.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
