<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernel Headers — Status</title>
<style>
:root {
  --bg: #0d1117;
  --fg: #c9d1d9;
  --fg-muted: #8b949e;
  --border: #30363d;
  --surface: #161b22;
  --ok: #3fb950;
  --warn: #d29922;
  --err: #f85149;
  --unavail: #484f58;
  --accent: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
  padding: 2rem;
}
h1 { margin-bottom: 0.25rem; }
.subtitle { color: var(--fg-muted); margin-bottom: 1.5rem; }

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.tab {
  padding: 0.6rem 1.5rem;
  cursor: pointer;
  color: var(--fg-muted);
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  font-size: 0.95rem;
  user-select: none;
}
.tab:hover { color: var(--fg); }
.tab.active {
  color: var(--fg);
  background: var(--surface);
  border-color: var(--border);
  position: relative;
}
.tab.active::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--surface);
}

.legend {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 2rem;
  font-size: 0.85rem;
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; }
.legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 2px;
  display: inline-block;
}
.series-section { margin-bottom: 2.5rem; }
.series-header {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 0.5rem;
}
.series-header h2 { font-size: 1.2rem; }
.series-meta { color: var(--fg-muted); font-size: 0.85rem; }
.grid-table {
  border-collapse: collapse;
  font-size: 0.8rem;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  display: block;
}
.grid-table th, .grid-table td {
  border: 1px solid var(--border);
  padding: 3px 6px;
  text-align: center;
  white-space: nowrap;
}
.grid-table th {
  background: var(--surface);
  position: sticky;
  top: 0;
}
.grid-table td.ver {
  text-align: left;
  font-family: monospace;
  font-size: 0.75rem;
}
.grid-table td.ver a { color: var(--fg); text-decoration: none; }
.grid-table td.ver a:hover { text-decoration: underline; }
.cell-ok { background: #1a3a25; color: var(--ok); font-weight: bold; }
.cell-unavail { background: #21262d; color: #666; }
.cell-missing-archive { background: #3d1a1a; color: var(--err); font-weight: bold; }
.cell-missing-install { background: #3d2e0a; color: var(--warn); font-weight: bold; }
.cell-no-image { background: #1c1c1c; color: #666; }
.summary { color: var(--fg-muted); font-size: 0.85rem; margin-top: 0.25rem; }
.loading { color: var(--fg-muted); font-style: italic; }
.error { color: var(--err); }
#updated { color: var(--fg-muted); font-size: 0.8rem; margin-bottom: 1.5rem; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>
<h1>Kernel Headers</h1>
<p class="subtitle">Build status across architectures</p>

<div class="tabs">
  <div class="tab active" data-tab="mainline">Mainline</div>
  <div class="tab" data-tab="ubuntu">Ubuntu</div>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-swatch" style="background:var(--ok)"></span> Installed</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--unavail)"></span> Not upstream</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--err)"></span> Missing from archive</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--warn)"></span> Available, not installed</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#1c1c1c; border:1px solid var(--border)"></span> No image</span>
</div>

<div id="updated"></div>

<div class="tab-content active" id="mainline-content">
  <p class="loading">Loading mainline data...</p>
</div>
<div class="tab-content" id="ubuntu-content">
  <p class="loading">Loading ubuntu data...</p>
</div>

<script>
const ICONS = {
  ok: "✅",
  unavailable: "⚪",
  missing_archive: "❌",
  missing_install: "🔺",
  no_image: "⬛",
};
const CLASSES = {
  ok: "cell-ok",
  unavailable: "cell-unavail",
  missing_archive: "cell-missing-archive",
  missing_install: "cell-missing-install",
  no_image: "cell-no-image",
};

// Tab switching
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab + "-content").classList.add("active");
  });
});

async function loadJson(url) {
  const resp = await fetch(url);
  if (!resp.ok) return null;
  return resp.json();
}

function versionSortKey(v) {
  return v.split(/[.-]/).map(Number);
}

function versionCompare(a, b) {
  const aa = versionSortKey(a), bb = versionSortKey(b);
  for (let i = 0; i < Math.max(aa.length, bb.length); i++) {
    const d = (aa[i] || 0) - (bb[i] || 0);
    if (d !== 0) return d;
  }
  return 0;
}

function renderSeries(prefix, kver, data, versionLinkFn, title) {
  const section = document.createElement("div");
  section.className = "series-section";

  const header = document.createElement("div");
  header.className = "series-header";
  const h2 = document.createElement("h2");
  h2.textContent = title;
  header.appendChild(h2);

  if (data.updated) {
    const meta = document.createElement("span");
    meta.className = "series-meta";
    meta.textContent = `updated ${new Date(data.updated).toLocaleString()}`;
    header.appendChild(meta);
  }
  section.appendChild(header);

  const versions = data.versions || {};
  const columns = data.columns || [];
  const allVersions = Object.keys(versions).sort(versionCompare);

  if (prefix === "mainline" && !data.has_archive && !data.has_install) {
    const p = document.createElement("p");
    p.className = "summary";
    p.textContent = `⬛ No Docker images exist yet (${allVersions.length} versions upstream)`;
    section.appendChild(p);
    return section;
  }

  if (allVersions.length === 0) {
    const p = document.createElement("p");
    p.className = "summary";
    p.textContent = "No versions found.";
    section.appendChild(p);
    return section;
  }

  const table = document.createElement("table");
  table.className = "grid-table";

  const thead = document.createElement("thead");
  const tr = document.createElement("tr");
  const thVer = document.createElement("th");
  thVer.textContent = "Version";
  tr.appendChild(thVer);
  for (const col of columns) {
    const th = document.createElement("th");
    th.textContent = col;
    tr.appendChild(th);
  }
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  let gaps = 0;
  for (const v of allVersions) {
    const row = document.createElement("tr");
    const tdVer = document.createElement("td");
    tdVer.className = "ver";
    if (versionLinkFn) {
      const a = document.createElement("a");
      a.href = versionLinkFn(v);
      a.textContent = v;
      a.target = "_blank";
      tdVer.appendChild(a);
    } else {
      tdVer.textContent = v;
    }
    row.appendChild(tdVer);

    let rowHasGap = false;
    for (const col of columns) {
      const status = versions[v][col] || "no_image";
      const td = document.createElement("td");
      td.className = CLASSES[status] || "";
      td.textContent = ICONS[status] || "?";
      td.title = `${v} / ${col}: ${status}`;
      row.appendChild(td);
      if (status !== "ok" && status !== "unavailable") rowHasGap = true;
    }
    if (rowHasGap) gaps++;
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  section.appendChild(table);

  const summary = document.createElement("p");
  summary.className = "summary";
  if (gaps === 0) {
    summary.textContent = `✅ All ${allVersions.length} versions fully available.`;
  } else {
    summary.textContent = `${gaps}/${allVersions.length} versions have gaps.`;
  }
  section.appendChild(summary);

  return section;
}

async function loadTab(prefix, containerId, versionLinkFn) {
  const container = document.getElementById(containerId);
  const meta = await loadJson(`data/${prefix}/meta.json`);
  if (!meta) {
    container.innerHTML = `<p class="error">No data available yet.</p>`;
    return;
  }

  container.innerHTML = "";

  // Normalize series list: strings or {name, version, title} objects
  const entries = (meta.series || []).map(s =>
    typeof s === "string" ? { name: s, version: s } : { name: s.name, version: s.version || s.name, title: s.title }
  );
  entries.sort((a, b) => versionCompare(b.version, a.version));

  for (const { name: kver, title } of entries) {
    const raw = await loadJson(`data/${prefix}/${kver}.json`);
    if (raw) {
      const data = (raw.series && raw.series[kver]) || raw;
      if (!data.updated && raw.updated) data.updated = raw.updated;
      container.appendChild(renderSeries(prefix, kver, data, versionLinkFn, title));
    } else {
      const section = document.createElement("div");
      section.className = "series-section";
      const h2 = document.createElement("h2");
      h2.textContent = title;
      section.appendChild(h2);
      const p = document.createElement("p");
      p.className = "error";
      p.textContent = "Failed to load data.";
      section.appendChild(p);
      container.appendChild(section);
    }
  }
}

async function main() {
  const updatedEl = document.getElementById("updated");

  // Load both tabs
  await Promise.all([
    loadTab("mainline", "mainline-content",
      v => `https://kernel.ubuntu.com/mainline/v${v}/`),
    loadTab("ubuntu", "ubuntu-content",
      null),
  ]);

  // Show most recent updated time
  const mainMeta = await loadJson("data/mainline/meta.json");
  const ubuntuMeta = await loadJson("data/ubuntu/meta.json");
  const times = [mainMeta?.updated, ubuntuMeta?.updated].filter(Boolean);
  if (times.length) {
    const latest = times.sort().pop();
    updatedEl.textContent = `Last updated: ${new Date(latest).toLocaleString()}`;
  }
}

main();
</script>
</body>
</html>
